seed: 42
output_dir: outputs/phase2_training/t2_how2sign_2d_temporal_reprojection_v6_seed42

data:
  train_glob: cache/phase2/t2_how2sign_2d_temporal_reprojection_v2/splits/train.json
  val_glob: cache/phase2/t2_how2sign_2d_temporal_reprojection_v2/splits/val.json
  reprojection_residual_scale: 10.0

model:
  input_dim: 45
  use_reprojection_skip: true
  hidden_size: 256
  num_layers: 6
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  max_frames: 64
  predict_uncertainty: false
  causal: false
  body_max_degrees: 25.0
  hand_max_degrees: 35.0

loss:
  rotation_weight: 1.0
  vertex_weight: 2.0
  joint_weight: 0.0
  fingertip_weight: 0.0
  palm_weight: 0.0
  observation_weight: 0.0
  velocity_weight: 0.25
  acceleration_weight: 0.1
  anchor_weight: 0.05
  biomechanical_weight: 0.01
  uncertainty_weight: 0.0

training:
  batch_size: 48
  gradient_accumulation: 1
  workers: 0
  bucket_by_length: true
  learning_rate: 0.0002
  weight_decay: 0.05
  warmup_fraction: 0.05
  gradient_clip: 1.0
  precision: bf16
  ema_decay: 0.999
  max_steps: 5000
  log_every: 10
  validate_every: 500
  checkpoint_every: 1000
  early_stopping_patience: 8
  uncertainty_only_steps: 0
  residual_mixture:
    real_fraction: 0.50
    synthetic_fraction: 0.25
    clean_fraction: 0.25

corruption:
  probability: 1.0
  min_duration: 2
  max_duration: 16
  max_rotation_degrees: 35.0
  modes:
    - upper_body
    - left_hand
    - right_hand
    - both_hands
    - finger_chain
    - wrist_attachment
    - keypoint_dropout
    - hand_swap
    - crop_truncation

geometry:
  enabled: true
  model_folder: SMPLer-X/common/utils/human_model_files
  assets_root: data/evaluation_from_author/data/data

# Frozen before any new Lane-L evaluation. These settings follow the proposal's
# 10--20-step T5 bound and are first accepted/rejected on external How2Sign.
t5:
  enabled: true
  steps: 15
  learning_rate: 0.03
  body_max_degrees: 3.0
  hand_max_degrees: 5.0
  anchor_weight: 0.05
  velocity_weight: 0.10
  acceleration_weight: 0.05
  minimum_relative_reprojection_gain: 0.002
  reprojection_worsening_tolerance: 0.001
