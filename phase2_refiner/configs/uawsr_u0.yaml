seed: 42
output_dir: outputs/phase2_training/uawsr_u0

data:
  train_glob: cache/phase2/v1/train/clips/*.npz
  val_glob: cache/phase2/v1/val/clips/*.npz

model:
  input_dim: 28
  hidden_size: 256
  num_layers: 6
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  max_frames: 64
  predict_uncertainty: false
  causal: false
  body_max_degrees: 25.0
  hand_max_degrees: 35.0

loss:
  rotation_weight: 1.0
  velocity_weight: 0.25
  acceleration_weight: 0.1
  anchor_weight: 0.05
  uncertainty_weight: 0.0

training:
  batch_size: 8
  gradient_accumulation: 4
  workers: 0
  learning_rate: 0.0002
  weight_decay: 0.05
  warmup_fraction: 0.05
  gradient_clip: 1.0
  max_steps: 100000
  log_every: 20
  validate_every: 500

corruption:
  probability: 0.65
  min_duration: 2
  max_duration: 16
  max_rotation_degrees: 35.0
