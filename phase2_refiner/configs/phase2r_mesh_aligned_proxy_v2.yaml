# Mechanism-development configuration only. The current cache is an H32 /
# same-view 2D proxy and is intentionally ineligible for formal G4-G6 evidence.
seed: 42
output_dir: outputs/phase2r/mesh_aligned_proxy_v2_seed42

data:
  train_glob: cache/phase2r/domain_aligned_v1/splits/train.json
  val_glob: cache/phase2r/domain_aligned_v1/splits/val.json
  require_phase2r_semantics: true
  formal_evidence: false
  evidence_tier: proxy
  physical_time_motion: true
  motion_reference_seconds: 0.04
  reprojection_residual_scale: 10.0

model:
  input_dim: 45
  use_reprojection_skip: false
  hidden_size: 256
  num_layers: 6
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  max_frames: 64
  temporal_attention: true
  causal: false
  predict_uncertainty: true
  uncertainty_feedback: true
  predict_benefit: true
  body_max_degrees: 25.0
  hand_max_degrees: 35.0

loss:
  rotation_weight: 1.0
  # Release-aligned, per-region centered mesh error is now a primary objective.
  vertex_weight: 5.0
  vertex_translation_centered: true
  joint_weight: 0.25
  fingertip_weight: 0.5
  palm_weight: 0.1
  observation_weight: 0.0
  velocity_weight: 0.25
  acceleration_weight: 0.1
  anchor_weight: 0.10
  biomechanical_weight: 0.01
  uncertainty_weight: 0.1
  uncertainty_ranking_weight: 0.05
  benefit_weight: 0.2
  benefit_target: vertex
  benefit_margin_mm: 0.10
  target_quality_weighting: true
  minimum_target_quality: 0.25
  physical_time_motion: true
  motion_reference_seconds: 0.04

inference:
  benefit_threshold: 0.6

training:
  batch_size: 48
  gradient_accumulation: 1
  workers: 0
  bucket_by_length: true
  learning_rate: 0.0001
  weight_decay: 0.05
  warmup_fraction: 0.05
  gradient_clip: 1.0
  precision: bf16
  ema_decay: 0.999
  max_steps: 5000
  log_every: 10
  validate_every: 500
  checkpoint_every: 1000
  early_stopping_patience: 5
  uncertainty_only_steps: 500
  # Checkpoint selection now matches the release metric and clean-safety regime.
  checkpoint_metric: vertex
  checkpoint_validation: clean
  residual_mixture:
    real_fraction: 0.60
    synthetic_fraction: 0.20
    clean_fraction: 0.20

corruption: &corruption
  probability: 1.0
  min_duration: 2
  max_duration: 16
  max_rotation_degrees: 35.0
  modes:
    - upper_body
    - left_hand
    - right_hand
    - both_hands
    - finger_chain
    - wrist_attachment
    - keypoint_dropout
    - hand_swap
    - crop_truncation

validation_corruption: *corruption

geometry:
  enabled: true
  model_folder: SMPLer-X/common/utils/human_model_files
  assets_root: data/evaluation_from_author/data/data
