# Full official PHOENIX-2014T/SOKE reconstruction run.
# Gradients: official train only. Checkpoint selection: official dev only.
# Official test is intentionally absent and is opened only after best.pt freezes.
seed: 42
output_dir: outputs/phase2r/phoenix_soke_full_raw_fusion_v1_seed42

data:
  train_glob: cache/signal4d_external/phoenix_soke_full_train_v1/splits/train.json
  val_glob: cache/signal4d_external/phoenix_soke_full_dev_v1/splits/val.json
  expected_train_split: train
  expected_val_split: val
  require_phase2r_semantics: true
  validation_all_windows: true
  physical_time_motion: true
  motion_reference_seconds: 0.04
  reprojection_residual_scale: 10.0

model:
  input_dim: 45
  use_reprojection_skip: true
  hidden_size: 256
  num_layers: 6
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  max_frames: 16
  temporal_attention: true
  causal: false
  predict_uncertainty: true
  uncertainty_feedback: true
  predict_benefit: true
  body_max_degrees: 20.0
  hand_max_degrees: 30.0

loss:
  rotation_weight: 1.0
  vertex_weight: 0.0
  joint_weight: 0.0
  fingertip_weight: 0.0
  palm_weight: 0.0
  observation_weight: 0.0
  velocity_weight: 0.15
  acceleration_weight: 0.05
  anchor_weight: 0.03
  biomechanical_weight: 0.01
  uncertainty_weight: 0.05
  uncertainty_ranking_weight: 0.02
  benefit_weight: 0.10
  benefit_target: rotation
  benefit_margin_degrees: 0.10
  # The SOKE release supplies finite-pose validity but no independently
  # validated jitter/quality score. Its binary target_quality is identical to
  # target_rotation_valid, so do not describe it as quality-weighted training.
  target_quality_weighting: false
  physical_time_motion: true
  motion_reference_seconds: 0.04

training:
  batch_size: 64
  gradient_accumulation: 1
  workers: 4
  bucket_by_length: true
  learning_rate: 0.0001
  weight_decay: 0.05
  warmup_fraction: 0.05
  gradient_clip: 1.0
  precision: bf16
  ema_decay: 0.999
  max_steps: 10000
  log_every: 10
  validate_every: 500
  checkpoint_every: 1000
  early_stopping_patience: 8
  uncertainty_only_steps: 100
  checkpoint_metric: rotation
  checkpoint_validation: clean
  residual_mixture:
    real_fraction: 0.70
    synthetic_fraction: 0.20
    clean_fraction: 0.10

corruption: &corruption
  probability: 1.0
  min_duration: 2
  max_duration: 12
  max_rotation_degrees: 30.0
  modes:
    - upper_body
    - left_hand
    - right_hand
    - both_hands
    - finger_chain
    - wrist_attachment
    - keypoint_dropout
    - hand_swap
    - crop_truncation

validation_corruption: *corruption

geometry:
  enabled: false
  model_folder: SMPLer-X/common/utils/human_model_files
  assets_root: null
