seed: 42
output_dir: outputs/phase2_training/uawsr_u1

data:
  train_glob: cache/phase2/v2/splits/train.json
  val_glob: cache/phase2/v2/splits/val.json

model:
  input_dim: 43
  hidden_size: 256
  num_layers: 6
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  max_frames: 64
  predict_uncertainty: true
  causal: false
  body_max_degrees: 25.0
  hand_max_degrees: 35.0

loss:
  rotation_weight: 1.0
  vertex_weight: 0.25
  joint_weight: 0.5
  fingertip_weight: 0.5
  palm_weight: 0.1
  observation_weight: 0.1
  velocity_weight: 0.25
  acceleration_weight: 0.1
  anchor_weight: 0.05
  biomechanical_weight: 0.01
  uncertainty_weight: 0.1

training:
  batch_size: 8
  gradient_accumulation: 4
  workers: 0
  bucket_by_length: true
  learning_rate: 0.0001
  weight_decay: 0.05
  warmup_fraction: 0.05
  gradient_clip: 1.0
  precision: bf16
  ema_decay: 0.999
  max_steps: 100000
  log_every: 20
  validate_every: 500
  checkpoint_every: 2000
  early_stopping_patience: 20
  uncertainty_only_steps: 5000

corruption:
  probability: 0.65
  min_duration: 2
  max_duration: 16
  max_rotation_degrees: 35.0
  modes:
    - upper_body
    - left_hand
    - right_hand
    - both_hands
    - finger_chain
    - wrist_attachment
    - keypoint_dropout
    - hand_swap
    - crop_truncation

geometry:
  enabled: false
  model_folder: SMPLer-X/common/utils/human_model_files
  assets_root: data/evaluation_from_author/data/data
