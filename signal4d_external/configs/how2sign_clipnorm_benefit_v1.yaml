seed: 42
output_dir: outputs/signal4d_external/how2sign_clipnorm_benefit_v1_seed42

data:
  train_glob: cache/phase2/t2_how2sign_2d_temporal_reprojection_v2/splits/train.json
  val_glob: cache/phase2/t2_how2sign_2d_temporal_reprojection_v2/splits/val.json
  calibration_glob: cache/phase2/t2_how2sign_2d_temporal_reprojection_v2/splits/calibration.json
  audit_all_clips: true
  reprojection_residual_scale: 10.0

model:
  # The cache remains the immutable 45-D representation. Three target-statistics-
  # free, clip-relative reprojection features are appended inside the new model.
  input_dim: 45
  augmented_input_dim: 48
  use_reprojection_skip: true
  hidden_size: 256
  num_layers: 6
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  max_frames: 64
  predict_uncertainty: false
  predict_benefit: true
  causal: false
  body_max_degrees: 18.0
  hand_max_degrees: 25.0
  external_init_checkpoint: outputs/phase2_training/t2_how2sign_2d_temporal_reprojection_v6_seed42/best.pt
  external_init_sha256: 8c4e8c011fd69e51b6bc492012f1eb1667384cb095b2996a14935b0a26d8a482

loss:
  rotation_weight: 1.0
  vertex_weight: 0.0
  joint_weight: 0.0
  fingertip_weight: 0.0
  palm_weight: 0.0
  observation_weight: 0.0
  velocity_weight: 0.25
  acceleration_weight: 0.1
  anchor_weight: 0.08
  biomechanical_weight: 0.01
  uncertainty_weight: 0.0
  benefit_weight: 0.15
  benefit_target: rotation
  benefit_margin_degrees: 0.05

training:
  # Sized to coexist with unrelated jobs currently occupying the shared GPU.
  batch_size: 6
  gradient_accumulation: 8
  workers: 0
  bucket_by_length: true
  learning_rate: 0.00008
  weight_decay: 0.05
  warmup_fraction: 0.05
  gradient_clip: 1.0
  precision: bf16
  ema_decay: 0.999
  max_steps: 1500
  log_every: 10
  validate_every: 250
  checkpoint_every: 500
  early_stopping_patience: 4
  uncertainty_only_steps: 0
  checkpoint_metric: rotation
  checkpoint_validation: clean
  residual_mixture:
    real_fraction: 0.60
    synthetic_fraction: 0.20
    clean_fraction: 0.20

corruption:
  probability: 1.0
  min_duration: 2
  max_duration: 12
  max_rotation_degrees: 25.0
  modes:
    - upper_body
    - left_hand
    - right_hand
    - both_hands
    - finger_chain
    - wrist_attachment
    - keypoint_dropout
    - hand_swap
    - crop_truncation

geometry:
  # Deliberately disabled: training must not read evaluator-owned SGNify masks.
  enabled: false
  model_folder: SMPLer-X/common/utils/human_model_files
  assets_root: null
