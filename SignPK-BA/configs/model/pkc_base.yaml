model:
  body_feature_dim: 12
  hand_feature_dim: 54
  relation_feature_dim: 20
  omni_feature_dim: 1024
  # Enable this width after running the optional H4WFeatureCapture hook.
  h4w_hand_feature_dim: 0
  # Existing H4W++ caches do not contain the large intermediate activation;
  # set this to its exported width when using a feature-hook cache.
  body_observer_feature_dim: 0
  hidden_dim: 256
  temporal_layers: 4
  attention_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  upper_body_joints: 14
  hand_joints: 15
  temporal_window: 9
  logvar_min: -6.0
  logvar_max: 4.0
