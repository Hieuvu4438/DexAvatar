[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal4d"
version = "0.1.0"
description = "Protocol-clean uncertainty-gated 4D sign reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Research-only; see repository component licenses"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.1",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "scikit-learn>=1.7,<1.8",
]

[project.optional-dependencies]
report = ["pandas>=1.5,<2", "pyarrow>=14"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
signal4d = "signal4d.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["evaluate_author_protocol.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
