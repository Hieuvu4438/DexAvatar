[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signeft-x"
version = "1.0.0"
description = "Target-free signer-consistent 3D sign-language reconstruction"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "smplx>=0.1.28",
  "torch>=2.1",
]

[project.scripts]
signeft = "signeft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
