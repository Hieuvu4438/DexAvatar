[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signeft-x"
version = "0.1.0"
description = "Evidence-factorized trust-region refinement for RGB-only sign reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy", "PyYAML", "torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

