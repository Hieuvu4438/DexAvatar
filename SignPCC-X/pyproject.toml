[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signpccx"
version = "0.1.0"
description = "Signer-personalized, chirality- and contact-aware SMPL-X fitting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
signpccx = "signpccx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

