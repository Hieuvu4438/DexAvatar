# Fast target-free DexAvatar proposal for source-domain cache construction.
# Keeps the released SignBPoser/SignHPoser, 2D reprojection, previous-frame
# temporal term, and body biomechanics.  Uses one short optimization stage and
# disables collision; it is an initializer proposal, not the exact baseline.
dataset: 'openpose'
joints_to_ign:
    - -1
data_folder: "data"
output_folder: 'smplx_debug'
prior_folder: 'priors'
model_folder: 'models'
result_folder: 'results'
gender: "neutral"
model_type: 'smplx'
use_cuda: True
float_dtype: "float32"
use_joints_conf: True
use_pca: True
use_hands: True
use_face: True
flat_hand_mean: False
sign_class: '../data/signs.txt'
sign_segment: '../data/segment.json'
signhposer_dir: './smplifyx/signhposer'
signbposer_dir: './smplifyx/signbposer'
num_gaussians: 8
body_prior_type: 'l2'
left_hand_prior_type: 'l2'
right_hand_prior_type: 'l2'
jaw_prior_type: 'l2'
focal_length: 5000
num_pca_comps: 12
rho: 100
interpenetration: False
df_cone_height: 0.0001
penalize_outside: True
max_collisions: 128
optim_type: 'lbfgsls'
ftol: 1e-7
gtol: 1e-7
lr: 0.5
maxiters: 10
interactive: True
visualize: False

data_weights: [1.0]
data_3d_weights: [0.0]
data_init_core_weights: [1200.0]
data_init_noncore_weights: [1200.0]
data_init_lhand_weights: [1200.0]
data_init_rhand_weights: [1200.0]
body_pose_prior_weights: [4.78]
coll_loss_weights: [0.0]
shape_weights: [5.0]
expr_weights: [5.0]
hand_pose_prior_weights: [4.78]
jaw_pose_prior_weights:
    - 47.8,478,478
body_joints_weights: [1.5]
hand_joints_weights: [2.5]
face_joints_weights: [2.0]
body_biomechanics_loss_weights: [100.0]

use_signbposer: True
use_hposer3d: True
