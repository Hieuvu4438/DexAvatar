# Sign-trained DPoser-X body prior + VQVAE hand prior, ACTIVE fitting mode with
# an annealed diffusion timestep (coarse-to-fine across the 4 stages).
#
# Based on fit_smplx_vposer_x_vqvae_dposerx.yaml. Only the body-prior block
# differs: it points at the sign-fine-tuned checkpoint + sign normalizer and
# enables per-stage annealed timesteps (dposerx_fixed_timesteps). Old configs
# are unaffected.
#
# Requires the sign body prior produced by scripts/train_dposerx_sign_body.sh
# and the sign normalizer from scripts/fit_sign_normalizer.py.
dataset: 'openpose'
joints_to_ign:
    - -1
data_folder: "data"
output_folder: 'smplx_debug_sign'
prior_folder: 'priors'
model_folder: 'models'
result_folder: 'results'
gender: "neutral"
model_type: 'smplx'
use_cuda: True
float_dtype: "float32"
use_joints_conf: True
use_pca: True
use_hands: True
use_face: True
flat_hand_mean: False
sign_class: '../data/signs.txt'
sign_segment: '../data/segment.json'
signhposer_dir: './smplifyx/signhposer'
signbposer_dir: './smplifyx/signbposer'
use_signbposer: False
use_hposer3d: False
use_vqvae_hand: True
use_dposerx_body: True
vqvae_hand_ckpt: '/home/haipd/DexAvatar/checkpoints/vqvae_hand/signhposer_vqvae/last.ckpt'
# --- sign-trained body prior (swap these after training) ---
dposerx_ckpt: '/home/haipd/DexAvatar/DPoser-X/checkpoints/dposer/sign/sign_body_ft/last.ckpt'
dposerx_config: '/home/haipd/DexAvatar/DPoser-X/configs/body/subvp/timefc.py'
dposerx_normalizer_dir: '/home/haipd/DexAvatar/checkpoints/dposerx_body_sign/body_normalizer'
# Active prior + annealed timestep (Strategy 2 + 3). guidance_scale tunable (Strategy 7).
dposerx_guidance_scale: 0.1
dposerx_timestep_strategy: fixed
dposerx_fixed_timesteps: [400, 200, 100, 50]
dposerx_loss_mode: x0_prediction
num_gaussians: 8
body_prior_type: 'l2'
left_hand_prior_type: l2
right_hand_prior_type: l2
jaw_prior_type: 'l2'
focal_length: 5000
num_pca_comps: 12
rho: 100
interpenetration: True
df_cone_height: 0.0001
penalize_outside: True
max_collisions: 128
optim_type: 'lbfgs'
lr: 1.0
gtol: 1e-8
ftol: 2e-9
maxiters: 100
body_pose_prior_weights: [404.0, 404.0, 57.4, 4.78]
hand_pose_prior_weights: [100.0, 50.0, 10.0, 5.0]
shape_weights: [100.0, 50.0, 10.0, 5.0]
expr_weights: [100.0, 50.0, 10.0, 5.0]
face_joints_weights: [0.0, 0.0, 0.0, 2.0]
body_joints_weights: [0.0, 0.0, 0.0, 2.0]
hand_joints_weights: [0.0, 0.0, 0.0, 2.0]
coll_loss_weights: [0.0, 0.0, 0.0, 0.0]
data_weights: [1, 1, 0.1, 0.1]
data_3d_weights: [1, 1, 1, 1]
data_init_core_weights: [100.0, 50.0, 10.0, 5.0]
data_init_noncore_weights: [0.0, 0.0, 0.0, 0.0]
data_init_lhand_weights: [0.0, 0.0, 0.0, 0.0]
data_init_rhand_weights: [0.0, 0.0, 0.0, 0.0]
use_absolute_depth_loss: False
absolute_depth_weight: 0.0
use_wrist_alignment_loss: False
wrist_alignment_weight: 0.0
