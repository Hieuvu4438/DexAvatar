# MotionBERT Body Pose Prior Configuration
# ==========================================
# Thay thế SignBPoser bằng pretrained MotionBERT + SMPL head
# Direct body pose optimization (không qua latent space)
#
# Usage:
#   python dexavatar_fitting/smplifyx/main.py \
#       --cfg cfg_files/fit_smplx_motionbert.yaml \
#       --images_folder data/frames/SIGN_NAME \
#       --output_folder outputs/motionbert/SIGN_NAME

dataset: 'openpose'
joints_to_ign:
    - -1
data_folder: "data"
output_folder: 'smplx_debug'
prior_folder: 'priors'
model_folder: 'models'
result_folder: 'results'
gender: "neutral"
model_type: 'smplx'
use_cuda: True
float_dtype: "float32"
use_joints_conf: True
use_pca: True
use_hands: True
use_face: True
flat_hand_mean: False
sign_class: '../data/signs.txt'
sign_segment: '../data/segment.json'

# ---- Prior Configuration ----
# Disable original SignBPoser
use_signbposer: False

# Enable MotionBERT prior
use_motionbert_prior: True
motionbert_prior_dir: './smplifyx/signbposer/snapshots_new/motionbert_best.pt'
motionbert_guidance_weight: 1.0

# Disable original SignHPoser (keep if you want hand prior)
use_hposer3d: True
signhposer_dir: './smplifyx/signhposer'

# Direct optimization (required for MotionBERT)
use_direct_optimization: True
direct_body_weight: 500

# ---- Optimization Settings ----
num_gaussians: 8
body_prior_type: 'l2'
left_hand_prior_type: l2
right_hand_prior_type: l2
jaw_prior_type: 'l2'
focal_length: 5000
num_pca_comps: 12
rho: 100
interpenetration: True
df_cone_height: 0.0001
penalize_outside: True
max_collisions: 128
optim_type: 'lbfgsls'
ftol: 1e-9
gtol: 1e-9
lr: 0.5
maxiters: 30
interactive: True
visualize: False

# ---- Loss Weights (3 stages) ----
data_weights:
    - 1.
    - 1.
    - 1.
data_3d_weights:
    - 0.
    - 0.
    - 0.
data_init_core_weights:
    - 1200.
    - 1200.
    - 1200.
data_init_noncore_weights:
    - 1200.
    - 1200.
    - 1200.
data_init_lhand_weights:
    - 1200.
    - 1200.
    - 1200.
data_init_rhand_weights:
    - 1200.
    - 1200.
    - 1200.
body_pose_prior_weights:
    - 4.78e0
    - 4.78e0
    - 4.78e0
coll_loss_weights:
    - 0.5
    - 1.0
    - 1.5
shape_weights:
    - 0.5e1
    - 0.5e1
    - 0.5e1
expr_weights:
    - 0
    - 0.5e1
    - 0.5e1
hand_pose_prior_weights:
    - 0
    - 4.78
    - 4.78
jaw_pose_prior_weights:
    - 47.8,478,478
    - 47.8,478,478
    - 47.8,478,478
body_joints_weights:
    - 0.5
    - 1.0
    - 1.5
hand_joints_weights:
    - 0.5
    - 1.5
    - 2.5
face_joints_weights:
    - 1.0
    - 1.0
    - 2.0
body_biomechanics_loss_weights:
    - 100.0
    - 100.0
    - 100.0
