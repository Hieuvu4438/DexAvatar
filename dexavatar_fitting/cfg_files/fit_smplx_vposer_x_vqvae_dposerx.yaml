# SOKE VQVAE hand + DPoser-X body — additive variant of the baseline config.
# This config is consumed by `dexavatar_fitting/smplifyx/main.py` when the
# runner invokes it with `--config` set to this file.
dataset: 'openpose'
joints_to_ign:
    - -1
data_folder: "data"
output_folder: 'smplx_debug'
prior_folder: 'priors'
model_folder: 'models'
result_folder: 'results'
gender: "neutral"
model_type: 'smplx'
use_cuda: True
float_dtype: "float32"
use_joints_conf: True
use_pca: True
use_hands: True
use_face: True
flat_hand_mean: False
sign_class: '../data/signs.txt'
sign_segment: '../data/segment.json'
# Old posers are NOT used in this variant. They must be disabled so the new
# VQVAE / DPoser-X branches in `fit_single_frame.py` are the only ones taken.
signhposer_dir: './smplifyx/signhposer'
signbposer_dir: './smplifyx/signbposer'
use_signbposer: False
use_hposer3d: False
# New posers
use_vqvae_hand: True
use_dposerx_body: True
# Checkpoint paths are passed via the runner shell (see
# methods/Full_running_command_wilor_vqvae_dposerx.sh). They appear here only
# as documentation — main.py reads from CLI flags, not from this YAML.
vqvae_hand_ckpt: '/home/haipd/DexAvatar/checkpoints/vqvae_hand/signhposer_vqvae/last.ckpt'
dposerx_ckpt: '/home/haipd/DexAvatar/checkpoints/dposerx_body/body.ckpt'
dposerx_config: '/home/haipd/DexAvatar/DPoser-X/configs/body/subvp/timefc.py'
dposerx_normalizer_dir: '/home/haipd/DexAvatar/checkpoints/dposerx_body/body_normalizer'

num_gaussians: 8
body_prior_type: 'l2'
left_hand_prior_type: l2
right_hand_prior_type: l2
jaw_prior_type: 'l2'
focal_length: 5000
num_pca_comps: 12
rho: 100
interpenetration: True
df_cone_height: 0.0001
penalize_outside: True
max_collisions: 128
# LBFGS with line search
optim_type: 'lbfgs'
lr: 1.0
gtol: 1e-8
ftol: 2e-9
maxiters: 100
# Stage 1: rough fit
body_pose_prior_weights: [4.04 * 1e2, 4.04 * 1e2, 57.4, 4.78]
hand_pose_prior_weights: [1e2, 5 * 1e1, 1e1, .5 * 1e1]
shape_weights: [1e2, 5 * 1e1, 1e1, .5 * 1e1]
expr_weights: [1e2, 5 * 1e1, 1e1, .5 * 1e1]
face_joints_weights: [0.0, 0.0, 0.0, 2.0]
body_joints_weights: [0.0, 0.0, 0.0, 2.0]
hand_joints_weights: [0.0, 0.0, 0.0, 2.0]
coll_loss_weights: [0.0, 0.0, 0.0, 0.0]
data_weights: [1, 1, 0.1, 0.1, 0.1]
data_3d_weights: [1, 1, 1, 1, 1]
data_init_core_weights: [1e2, 5 * 1e1, 1e1, .5 * 1e1]
data_init_noncore_weights: [0.0, 0.0, 0.0, 0.0]
data_init_lhand_weights: [0.0, 0.0, 0.0, 0.0]
data_init_rhand_weights: [0.0, 0.0, 0.0, 0.0]
use_hposer3d: False
